name: Deploy alerts
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'sandbox'
    paths:
      - '.nais/alerts.yml'

jobs:
  deploy-alerts-dev:
    name: Deploy dev alerts
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy alerts
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/alerts.yml,.nais/alerts-q1.yml
  deploy-alerts-prod:
    name: Deploy prod alerts
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy alerts
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/alerts.yml
