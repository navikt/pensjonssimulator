name: 'Kjør end to end tester i Sandbox'

on:
  workflow_dispatch:
  workflow_call:

jobs:
  runIntegrationTests:
    permissions:
      contents: "write"
      checks: "write"
      id-token: "write"
      packages: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          cache: gradle
          java-version: 25
          distribution: temurin
      - name: Change wrapper permissions
        working-directory: end-to-end-test
        run: chmod +x ./gradlew
      - name: Build
        working-directory: end-to-end-test
        run: ./gradlew clean build
      - name: Build Docker image
        id: docker-build-push
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        with:
          dockerfile: .docker/Dockerfile-EndToEndTest
          team: pensjonskalkulator
          image_suffix: end-to-end
      - name: deploy to Nais
        id: docker-deploy
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
            CLUSTER: dev-gcp
            IMAGE: ${{ steps.docker-build-push.outputs.image }}
            RESOURCE: .nais/run-end-to-end-test-dev.yml