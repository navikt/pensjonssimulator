apiVersion: krakend.nais.io/v1
kind: Krakend
metadata:
  name: pensjonssimulator
  namespace: pensjonskalkulator
  labels:
    team: pensjonskalkulator
spec:
  authProviders:
    - name: maskinporten
      alg: RS256
      jwkUrl: "https://maskinporten.no/jwk"
      issuer: "https://maskinporten.no/"
  ingress:
    className: external-haproxy
    enabled: true
    hosts:
      - host: pensjon-gw.nav.no
        paths:
          - path: /simuler/alderspensjon/
            pathType: Prefix
          - path: /pensjonssimulator/
            pathType: Prefix
